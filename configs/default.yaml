project_root: .

paths:
  baseline: data/baseline
  telemetry_labeled: data/telemetry_harvested
  artifacts: artifacts

api:
  base_url: http://127.0.0.1:5300
  timeout_s: 10
  retries: 2

baseline:
  manifest: manifest.jsonl
  sha256: null

promote:
  categories:
    TP: positive
    CONFUSER: negative_confuser
    SPEECH_NEG: negative_speech
    NOISE: negative_noise
  dedup_iou_threshold: 0.8
  confuser_ratio: 0.15
  test_size: 0.2
  random_state: 42

train:
  epochs_l1: 20
  epochs_l2: 20
  batch_size: 64
  lr_l1: 0.0015
  lr_l2: 0.001
  th_hard: 0.35
  err_repeat: 3
  seed: 42
  k_easy: 0.0
  gamma_easy: 1.0
