[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wake-lab"
version = "0.1.0"
description = "Wake word data pipeline lab (Kouki tools)"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pyyaml",
  "soundfile",
  "numpy",
  "scikit-learn",
  "safetensors>=0.8.0",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
wake-lab = "wake_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wake_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# B008: typer.Option(...)/typer.Argument(...) в дефолтах аргументов — штатный паттерн typer,
#       иначе CLI-команды читаются хуже и расходятся с документацией typer.
# BLE001: осознанные catch Exception — стадия promote не падает целиком из-за одного битого
#       сэмпла/сайдкара: пишет warning и продолжает (см. src/wake_lab/stages/promote.py:64,223).
ignore = ["B008", "BLE001"]
