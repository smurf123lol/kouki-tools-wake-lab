[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wake-lab"
version = "0.1.0"
description = "Wake word data pipeline lab (Kouki tools)"
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12",
  "pyyaml",
  "soundfile",
  "numpy",
  "scikit-learn",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
]

[project.scripts]
wake-lab = "wake_lab.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/wake_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
